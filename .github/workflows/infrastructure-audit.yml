name: HealthONE independent infrastructure audit
on:
  workflow_dispatch:
  schedule:
    - cron: '25 7 * * *'
      timezone: "Asia/Jerusalem"
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Audit live HTTP, TLS and DNS
        shell: bash
        run: |
          python3 - <<'PY'
          import subprocess, ssl, socket, urllib.request, urllib.error, datetime, json, re, sys
          results=[]
          def check(label,ok,detail):
              results.append((label,bool(ok),str(detail)[:350]))
          hosts=['health-one.org','www.health-one.org','health-one.org.il','www.health-one.org.il']
          for host in hosts:
              url='https://'+host+'/'
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'HealthONE-independent-audit/1.0'})
                  with urllib.request.urlopen(req,timeout=18) as r:
                      body=r.read(500000).decode('utf-8','replace')
                      final=r.geturl()
                      check('HTTPS '+host,r.status==200 and 'health-one.org' in final,f'{r.status} => {final}')
                      if host=='health-one.org':
                          labels=['About','What we do','Northern Israel','Global bridge','Collaboration','Team','Contact']
                          missing=[s for s in labels if s.lower() not in body.lower()]
                          check('Homepage navigation',not missing,'missing: '+repr(missing))
              except Exception as e: check('HTTPS '+host,False,repr(e))
              try:
                  with socket.create_connection((host,443),timeout=12) as sock:
                      with ssl.create_default_context().wrap_socket(sock,server_hostname=host) as tls:
                          cert=tls.getpeercert()
                          expiry=datetime.datetime.strptime(cert['notAfter'],'%b %d %H:%M:%S %Y %Z').replace(tzinfo=datetime.timezone.utc)
                          days=(expiry-datetime.datetime.now(datetime.timezone.utc)).days
                          check('TLS '+host,days>=14,f'expires {expiry.isoformat()} ({days} days)')
              except Exception as e: check('TLS '+host,False,repr(e))
          for path in ('/robots.txt','/sitemap.xml','/team.html'):
              try:
                  with urllib.request.urlopen('https://health-one.org'+path,timeout=15) as r:
                      body=r.read(400000).decode('utf-8','replace')
                      ok=r.status==200
                      if path=='/team.html':
                          ok=ok and all(s in body.lower() for s in ['oded','orit','rinat'])
                      if path=='/robots.txt': ok=ok and 'disallow: /' not in body.lower()
                      if path=='/sitemap.xml': ok=ok and ('<urlset' in body or '<sitemapindex' in body)
                      check(path,ok,f'HTTP {r.status}; {len(body)} chars')
              except Exception as e: check(path,False,repr(e))
          def dig(name,typ):
              p=subprocess.run(['dig','+time=4','+tries=2','+short',name,typ],capture_output=True,text=True,timeout=15)
              if p.returncode: raise RuntimeError(p.stderr.strip())
              return [x.strip().strip('"') for x in p.stdout.splitlines() if x.strip()]
          for name,typ in [('health-one.org','A'),('health-one.org','AAAA'),('www.health-one.org','CNAME'),('health-one.org','MX'),('health-one.org','TXT'),('_dmarc.health-one.org','TXT')]:
              try:
                  values=dig(name,typ)
                  if typ=='A': ok=any(x in ['185.199.108.153','185.199.109.153','185.199.110.153','185.199.111.153'] for x in values)
                  elif typ=='AAAA': ok=not values or any(x.lower().startswith('2606:50c0:800') for x in values)
                  elif typ=='CNAME': ok=bool(values) or bool(dig(name,'A'))
                  elif typ=='MX': ok=any('mx' in x.lower() and 'cloudflare' in x.lower() for x in values)
                  elif name.startswith('_dmarc'): ok=any('v=DMARC1' in x for x in values)
                  else: ok=any('v=spf1' in x.lower() for x in values)
                  check('DNS '+name+' '+typ,ok,repr(values))
              except Exception as e: check('DNS '+name+' '+typ,False,repr(e))
          try:
              txt=dig('health-one.org','TXT')
              check('DKIM discovery',True,'DKIM selectors cannot be exhaustively discovered via DNS; verify known selectors separately')
          except Exception as e: check('DKIM discovery',False,repr(e))
          summary={'checked_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'results':[{'check':a,'passed':b,'detail':c} for a,b,c in results]}
          with open('healthone-audit.json','w') as f: json.dump(summary,f,indent=2)
          with open('healthone-audit.md','w') as f:
              f.write('# HealthONE independent audit\n\n')
              for a,b,c in results: f.write(f"- {'PASS' if b else 'ISSUE'} **{a}**: {c}\n")
          print(open('healthone-audit.md').read())
          with open(__import__('os').environ['GITHUB_STEP_SUMMARY'],'a') as f: f.write(open('healthone-audit.md').read())
          if not all(b for _,b,_ in results): sys.exit(1)
          PY
      - name: Upload machine-readable audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: healthone-infrastructure-audit
          path: |
            healthone-audit.json
            healthone-audit.md
          retention-days: 30
